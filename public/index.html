<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feature Board · Portfolio demo</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><main><header><a class="brand" href="/">◈ Feature Board</a><span class="demo">PORTFOLIO DEMO</span></header><section class="intro"><p class="eyebrow">WORKSPACE / PRODUCT</p><h1>Small features.<br>Steady progress.</h1><p>A clear view of what’s planned, in motion, and ready to review.</p></section><section aria-label="Feature requests"><div class="toolbar"><h2>Feature requests</h2><span id="count" role="status" aria-live="polite"></span></div><form class="filters" id="filters" role="search"><label>Search requests<input name="q" type="search" placeholder="Search title, description or app"></label><div class="status-filter"><label for="status">Status</label><select id="status" name="status"><option value="">All statuses</option><option>Planned</option><option>In progress</option><option>Review</option><option>Done</option></select></div><button type="submit">Apply filters</button><button type="button" id="clear">Clear</button></form><p id="error" role="alert" hidden></p><div id="board" class="board" aria-busy="true"><p>Loading requests…</p></div></section><footer>Sample data · Node.js API · No account required</footer></main></body></html>
